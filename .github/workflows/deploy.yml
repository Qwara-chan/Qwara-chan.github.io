name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v4 (2025-01-15)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        # actions/setup-node@v4 (2025-05-01)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install CJK fonts for OG image generation
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Build with Astro
        # Actions auto-exports GITHUB_TOKEN to every step, and the fetch script
        # picks it up itself — no explicit env needed for the repo-fetch quota bump.
        run: npm run build

      - name: Upload artifact
        # actions/upload-pages-artifact@v3 (2025-03-31)
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # actions/deploy-pages@v4 (2025-03-13)
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
